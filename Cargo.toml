[package]
name = "qr-logo"
version = "0.1.0"
edition = "2021"
description = "QR code generator with a color logo, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.9", default-features = false }
wasm-bindgen = "0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
